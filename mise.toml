# A C++20 compiler and an Emacs built with native module support are external
# prerequisites (see README.org); this file only drives CMake.
#
# Dependencies (gRPC/protobuf) are not managed by mise -- vcpkg cannot be a
# mise tool (it ships no binaries).  They are declared in vcpkg.json and CMake
# itself wires them: CMakePresets.json points configure at vcpkg's toolchain
# file ($env{VCPKG_ROOT}, exported by the shell) and the manifest deps land
# in build/vcpkg_installed.

[tools]
cmake = "latest"

[tasks.configure]
description = "Configure the CMake build directory (via CMakePresets.json)"
run = "cmake --preset default"

[tasks.build]
description = "Compile the native module into build/"
depends = ["configure"]
run = "cmake --build --preset default"

[tasks.check]
description = "Build, then smoke-test the module in Emacs batch mode"
depends = ["build"]
run = 'emacs -Q --batch --eval "(progn (module-load (expand-file-name (concat \"build/libemacs-rpc-bridge\" module-file-suffix))) (unless (fboundp (quote emacs-rpc-bridge-hello)) (kill-emacs 1)) (princ (emacs-rpc-bridge-hello)) (terpri)))"'
